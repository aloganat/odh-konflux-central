# Reference copy with early-gate guard.
# Apply this change to: opendatahub-io/ODH-Build-Config/.github/workflows/process-operator-bundle.yaml
#
# CHANGE: Added '&& !contains(github.event.head_commit.message, '[early-gate]')' to the job if-condition
# to prevent double-processing when early-gate pipeline handles bundle processing internally.

name: Process Operator Bundle
run-name: Process Operator Bundle
on:
  workflow_dispatch:
  push:
    paths:
    - bundle/additional-images-patch.yaml
    - bundle/bundle-patch.yaml
    - bundle/csv-patch.yaml
    - to-be-processed/bundle/**
    branches:
    - 'main'
permissions:
  contents: write

env:
  GITHUB_ORG: opendatahub-io
  GITHUB_RKA_ORG: red-hat-data-services

jobs:
  process-bundle:
    # EARLY-GATE GUARD: skip if commit message contains [early-gate]
    if: ${{ github.ref_name == 'main' && !contains(github.event.head_commit.message, '[early-gate]') }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/rhoai/rhoai-task-toolset:latest
    steps:
    - name: Get Current branch name
      shell: bash
      run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      id: get_branch
    - name: Git checkout build config main
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.get_branch.outputs.branch }}
        path: ${{ steps.get_branch.outputs.branch }}
    - name: Git checkout utils
      uses: actions/checkout@v4
      with:
        repository: ${{ env.GITHUB_RKA_ORG }}/RHOAI-Konflux-Automation
        ref: 'odh'
        path: utils
    - name: Install dependencies
      run: |
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m | sed 's/x86_64/amd64/')"
        yq_version="v4.44.3"
        yq_filename="yq-$yq_version"
        echo "-> Downloading yq" >&2
        curl -sSfLo "$yq_filename" "https://github.com/mikefarah/yq/releases/download/$yq_version/yq_${os}_${arch}"
        chmod +x $yq_filename
        ln -s $yq_filename yq
        cp $yq_filename /usr/local/bin/yq

        pip install --default-timeout=100 -r utils/utils/bundle-processor/requirements.txt
    - name: Process Operator Bundle
      env:
        BRANCH: ${{ steps.get_branch.outputs.branch }}
        OC_TOKEN: ${{ secrets.KONFLUX_INTERNAL_OC_TOKEN }}
        CLUSTER: p02
        OPENDATAHUB_QUAY_API_TOKEN: ${{ secrets.OPENDATAHUB_QUAY_API_TOKEN }}
      run: |
        OPENSHIFT_VERSION=v4.20
        OPERATOR_BUNDLE_COMPONENT_NAME=odh-operator-bundle-ci
        QUAY_TAG=odh-stable

        RAW_INPUTS_DIR=utils/tmp/bundle
        mkdir -p $RAW_INPUTS_DIR
        cp -r ${BRANCH}/to-be-processed/bundle/* $RAW_INPUTS_DIR

        BUILD_CONFIG_PATH=${BRANCH}/config/build-config.yaml
        BUNDLE_CSV_PATH=${RAW_INPUTS_DIR}/manifests/rhods-operator.clusterserviceversion.yaml
        PATCH_YAML_PATH=${BRANCH}/bundle/bundle-patch.yaml
        OUTPUT_FILE_PATH=${RAW_INPUTS_DIR}/manifests/rhods-operator.clusterserviceversion.yaml
        SNAPSHOT_JSON_PATH=${BRANCH}/config/snapshot.json
        ANNOTATION_YAML_PATH=${RAW_INPUTS_DIR}/metadata/annotations.yaml
        PUSH_PIPELINE_PATH=${BRANCH}/.tekton/${OPERATOR_BUNDLE_COMPONENT_NAME}-push.yaml

        python3 utils/utils/bundle-processor/bundle-processor.py -op bundle-patch -b ${BUILD_CONFIG_PATH} -c ${BUNDLE_CSV_PATH} -p ${PATCH_YAML_PATH} -sn ${SNAPSHOT_JSON_PATH} -o ${OUTPUT_FILE_PATH} -q ${QUAY_TAG} -r ${BRANCH} -a ${ANNOTATION_YAML_PATH} --push-pipeline-yaml-path ${PUSH_PIPELINE_PATH} --push-pipeline-operation enable
        cp -r ${RAW_INPUTS_DIR}/* ${BRANCH}/bundle
    - name: Commit and push the changes to release branch
      uses: actions-js/push@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ steps.get_branch.outputs.branch }}
        message: "Updating the bundle-csv with latest images"
        repository: ${{ env.GITHUB_ORG }}/ODH-Build-Config
        directory: ${{ steps.get_branch.outputs.branch }}
        author_name: Openshift-AI DevOps
        author_email: openshift-ai-devops@redhat.com
