apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/data-science-pipelines?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull" && target_branch
      == "$$TARGET_BRANCH$$"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: opendatahub-release
    appstudio.openshift.io/component: odh-ml-pipelines-api-server-v2
    pipelines.appstudio.openshift.io/type: build
  name: odh-ml-pipelines-api-server-v2-on-pull
  namespace: open-data-hub-tenant
spec:
  params:
# pipeline-type, additional-tags
# check why linux-extra-fast/amd64 as the default value in contianer build pipeline
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/opendatahub/ds-pipelines-api-server:odh-pr-{{revision}}
  - name: dockerfile
    value: backend/Dockerfile
  - name: path-context
    value: .
  - name: build-platforms
    value:
    - linux/x86_64
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: '{{ target_branch }}' # branch name of the konflux-central, needs to be main
    - name: pathInRepo
      value: pipeline/container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-ml-pipelines-api-server-v2
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
