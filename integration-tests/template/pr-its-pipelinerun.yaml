---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: odh-pr-test
  namespace: open-data-hub-tenant
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" || event == "retest-all-comment"
spec:
  pipelineSpec:
    description: |
      An integration test which provisions an ephemeral Hypershift cluster, deploys opendatahub-operator 
      from a Konflux snapshot and runs the e2e tests against it.
    params:
      - description: Snapshot of the application
        name: SNAPSHOT
        type: string
    #test
    tasks:
      - name: parse-metadata
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/konflux-ci/integration-examples
            - name: revision
              value: main
            - name: pathInRepo
              value: tasks/test_metadata.yaml
        params:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)
      - name: find-component-image
        description: Placeholder task that prints the Snapshot and outputs standard TEST_OUTPUT
        runAfter:
          - parse-metadata
        params:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)
        taskSpec:
          params:
          - name: SNAPSHOT
          steps:
          - image: quay.io/konflux-ci/konflux-test:stable
            workingDir: /workspace
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: COMPONENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['appstudio.openshift.io/component']
            script: |
              #!/bin/sh
      
              # Extract the component container image from the SNAPSHOT JSON data
              COMPONENT_CONTAINER_IMAGE=$(jq -r --arg component_name "${COMPONENT_NAME}" '.components[] | select(.name == $component_name) | .containerImage' <<< "${SNAPSHOT}")
      
              # Log the extracted variable
              echo "  COMPONENT_CONTAINER_IMAGE: ${COMPONENT_CONTAINER_IMAGE}"

      - name: check-prerequisites
        description: check prerequisites if the ITS needs to execute
        runAfter:
          - find-component-image
        taskSpec:
          results:
          - name: event-type
            description: "stores info about event type"
          steps:
          - image: quay.io/konflux-ci/konflux-test:stable
            env:
              - name: EVENT_TYPE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['pac.test.appstudio.openshift.io/event-type']
            script: |
              #!/bin/bash
              set -e
              echo "EVENT_TYPE=${EVENT_TYPE}"
              echo -n "${EVENT_TYPE}" > $(results.event-type.path)

      - name: clone-repository
        params:
        - name: url
          value: "https://github.com/opendatahub-io/opendatahub-operator.git"
        - name: revision
          value: main
        - name: ociStorage
          value: "quay.io/opendatahub/opendatahub-operator:odh-stable-poc.git"
        - name: ociArtifactExpiresAfter
          value: ""
        runAfter:
        - init
        taskRef:
          params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.1@sha256:8ecf57d5a6697ce709bee65b62781efe79a10b0c2b95e05576442b67fbd61744
          - name: kind
            value: task
          resolver: bundles
        workspaces:
        - name: basic-auth
          workspace: git-auth
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-operator
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'